name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same pull request cancels the run that's still going.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # "Tests (Linux)", "Tests (macOS)", and "Tests (Windows)": the names the
    # "Protect main" ruleset requires (MOCHI-60).
    name: Tests (${{ matrix.name }})
    strategy:
      # One system failing doesn't cancel the others, so every failure shows
      # at once.
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exactly what package-lock.json says
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Reuse the downloaded test copy of VS Code
        uses: actions/cache@v6
        with:
          path: .vscode-test/vscode-*
          key: vscode-test-${{ runner.os }}-${{ hashFiles('package.json') }}

      # Linux runners have no screen, so VS Code runs on a virtual one.
      - name: Integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration

      - name: Integration tests
        if: runner.os != 'Linux'
        run: npm run test:integration

      # One package for every system, so it's built and checked once.
      - name: Package the .vsix
        if: runner.os == 'Linux'
        run: npm run package

      # The bundle is the only code that ships: no source, no compiled tests,
      # no developer-only tools, no other JavaScript.
      - name: Check the package contents
        if: runner.os == 'Linux'
        run: |
          unzip -l *.vsix
          if unzip -l *.vsix | grep -E " extension/(src|out)/"; then
            echo "::error::The .vsix contains src/ or out/. Check .vscodeignore."
            exit 1
          fi
          # The extension's bundle, the panel's script (MOCHI-16), and the
          # "Make it yours" page's script (MOCHI-43).
          code=$(unzip -Z1 *.vsix | grep -E '\.(js|cjs|mjs)$' | sort | tr '\n' ' ' || true)
          if [ "$code" != "extension/dist/extension.js extension/dist/webview/panel.js extension/dist/webview/yours.js " ]; then
            echo "::error::The only code in the .vsix must be extension/dist/extension.js and the two webview scripts, dist/webview/panel.js and dist/webview/yours.js. Found: $code"
            exit 1
          fi
          if ! unzip -Z1 *.vsix | grep -qx "extension/THIRD_PARTY_NOTICES.md"; then
            echo "::error::The .vsix must include THIRD_PARTY_NOTICES.md, the licenses of bundled code."
            exit 1
          fi
          if ! unzip -Z1 *.vsix | grep -qx "extension/LICENSE.txt"; then
            echo "::error::The .vsix must include the LICENSE."
            exit 1
          fi
          # Only the default pack ships: never a personal layer or a gift.
          if unzip -Z1 *.vsix | grep -E "^extension/packs/" | grep -vE "^extension/packs/default/"; then
            echo "::error::The .vsix may only contain the default pack."
            exit 1
          fi
