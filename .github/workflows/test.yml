name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same pull request cancels the run that's still going.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exactly what package-lock.json says
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Reuse the downloaded test copy of VS Code
        uses: actions/cache@v6
        with:
          path: .vscode-test/vscode-*
          key: vscode-test-${{ runner.os }}-${{ hashFiles('package.json') }}

      # Linux runners have no screen, so VS Code runs on a virtual one.
      - name: Integration tests
        run: xvfb-run -a npm run test:integration
